<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Al-Quran EPUB Generator</title>
        <link rel="icon" href="data:," />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="bg-pattern"></div>

        <header class="site-header">
            <div class="header-inner">
                <div class="logo-mark">&#x06E9;</div>
                <div class="header-text">
                    <h1 class="site-title">Al-Quran EPUB Generator</h1>
                    <p class="site-sub">Data dari AlQuran.cloud API</p>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Options -->
            <section class="card" id="section-options">
                <h2 class="card-title">Opsi</h2>
                <div class="options-grid">
                    <label class="field-label">
                        API key AlQuran.cloud
                        <input
                            class="text-field"
                            type="password"
                            id="api-key"
                            placeholder="Masukkan API key"
                            autocomplete="off"
                        />
                        <small
                            >Dipakai sebagai parameter apikey saat mengambil
                            data.</small
                        >
                    </label>
                    <label class="field-label">
                        Edisi teks Arab
                        <select class="text-field" id="edition-arabic">
                            <option value="quran-uthmani">
                                quran-uthmani - Uthmani
                            </option>
                        </select>
                        <small>Daftar diambil dari AlQuran.cloud.</small>
                    </label>
                    <label class="field-label">
                        Edisi latin
                        <select class="text-field" id="edition-latin">
                            <option value="en.transliteration">
                                en.transliteration - English Transliteration
                            </option>
                        </select>
                        <small
                            >Dipakai untuk transliterasi latin per ayat.</small
                        >
                    </label>
                    <label class="field-label">
                        Edisi terjemahan
                        <select class="text-field" id="edition-translation">
                            <option value="">Tanpa terjemahan</option>
                            <option value="id.indonesian">
                                id.indonesian - Bahasa Indonesia
                            </option>
                        </select>
                        <small
                            >Boleh dikosongkan jika EPUB hanya perlu Arab dan
                            latin.</small
                        >
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-page" checked />
                        <span class="toggle-track"
                            ><span class="toggle-thumb"></span
                        ></span>
                        <span class="toggle-text">
                            Nomor Halaman Mushaf
                            <small
                                >Nomor halaman Mushaf Madinah di setiap
                                ayat</small
                            >
                        </span>
                    </label>
                    <label class="field-label">
                        Font Arab
                        <select class="text-field" id="opt-font">
                            <option value="scheherazade-new-arabic-400-normal">
                                Scheherazade New
                            </option>
                            <option value="amiri-quran-400-normal">
                                Amiri Quran
                            </option>
                            <option value="kfgqpc-hafs-400-normal">
                                KFGQPC Hafs
                            </option>
                            <option value="kfgqpc-hafs-smart-400-normal">
                                KFGQPC Hafs Smart
                            </option>
                            <option value="noto-naskh-arabic-400-normal">
                                Noto Naskh Arabic
                            </option>
                        </select>
                        <small
                            >Font yang digunakan untuk teks Arab di EPUB.</small
                        >
                    </label>
                </div>
                <div class="filename-row">
                    <label class="filename-label" for="opt-filename"
                        >Nama file output</label
                    >
                    <div class="filename-input-wrap">
                        <input
                            type="text"
                            id="opt-filename"
                            value="AlQuran-Kindle"
                        />
                        <span class="filename-ext">.epub</span>
                    </div>
                </div>
            </section>

            <!-- Generate button -->
            <div class="generate-wrap">
                <button class="btn-generate" id="btn-generate">
                    <span class="btn-generate-icon">&#x1F4D6;</span>
                    <span class="btn-generate-text">Generate EPUB</span>
                </button>
            </div>

            <!-- Progress -->
            <section
                class="card progress-card"
                id="section-progress"
                style="display: none"
            >
                <div class="progress-header">
                    <span class="progress-title" id="progress-title"
                        >Mempersiapkan...</span
                    >
                    <span class="progress-pct" id="progress-pct">0%</span>
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-detail" id="progress-detail"></p>
            </section>
        </main>

        <footer class="site-footer">
            <p>
                Data:
                <a href="https://alquran.cloud/api" target="_blank"
                    >AlQuran.cloud API</a
                >
                &nbsp;·&nbsp; Font:
                <a href="https://software.sil.org/scheherazade/" target="_blank"
                    >Scheherazade New (SIL OFL)</a
                >
            </p>
        </footer>

        <script type="module" src="main.js"></script>
    </body>
</html>
