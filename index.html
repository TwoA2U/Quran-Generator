<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Al-Quran EPUB Generator</title>
        <link rel="icon" href="data:," />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Naskh+Arabic:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <div class="bg-pattern"></div>

        <header class="site-header">
            <div class="header-inner">
                <div class="logo-mark">&#x06E9;</div>
                <div class="header-text">
                    <h1 class="site-title">Al-Quran EPUB Generator</h1>
                    <p class="site-sub">
                        Data lokal dari public/script &amp; public/translation
                    </p>
                </div>
            </div>
        </header>

        <main class="container">
            <!-- Options -->
            <section class="card" id="section-options">
                <h2 class="card-title">Opsi</h2>
                <div class="options-grid">
                    <label class="field-label">
                        Teks Arab (script)
                        <select class="text-field" id="edition-arabic">
                            <!-- populated by JS from AVAILABLE_SCRIPTS -->
                        </select>
                        <small>
                            File dari <code>public/script/</code> — rekomendasi:
                            <strong>qpc_hafs</strong> atau
                            <strong>uthmani</strong>
                        </small>
                    </label>
                    <label class="field-label">
                        Terjemahan
                        <select class="text-field" id="edition-translation">
                            <!-- populated by JS from AVAILABLE_TRANSLATIONS -->
                        </select>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-latin" checked />

                        <span class="toggle-track"
                            ><span class="toggle-thumb"></span
                        ></span>

                        <span class="toggle-text">
                            Transliteration
                            <small>English Transliteration</small>
                        </span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-page" checked />

                        <span class="toggle-track"
                            ><span class="toggle-thumb"></span
                        ></span>

                        <span class="toggle-text">
                            Nomor Halaman Mushaf
                            <small
                                >Nomor halaman Mushaf Madinah di setiap ayat
                                (jika tersedia)</small
                            >
                        </span>
                    </label>

                    <label class="field-label">
                        Font Arab
                        <select class="text-field" id="opt-font">
                            <option value="scheherazade-new-arabic-400-normal">
                                Scheherazade New
                            </option>
                            <option value="amiri-quran-400-normal">
                                Amiri Quran
                            </option>
                            <option
                                value="quran-complex-ver2-arabic-400-normal"
                            >
                                Quran Complex Font Version 2
                            </option>
                            <option
                                value="kfgqpc-hafs-uthmanic-script-arabic-400-normal"
                            >
                                KFGQPC Uthmanic Script HAFS
                            </option>
                            <option value="kfgqpc-hafs-400-normal">
                                KFGQPC Hafs
                            </option>
                            <option value="kfgqpc-hafs-smart-400-normal">
                                KFGQPC Hafs Smart
                            </option>
                            <option value="noto-naskh-arabic-400-normal">
                                Noto Naskh Arabic
                            </option>
                        </select>
                        <small>
                            Rekomendasi: gunakan
                            <strong>KFGQPC Uthmanic Script HAFS</strong> dengan
                            script <strong>qpc_hafs</strong>, atau
                            <strong>Quran Complex Font Version 2</strong> /
                            <strong>Scheherazade New</strong> /
                            <strong>Amiri Quran</strong> dengan script
                            <strong>uthmani</strong>.
                        </small>
                    </label>
                </div>
                <div class="filename-row">
                    <label class="filename-label" for="opt-filename"
                        >Nama file output</label
                    >
                    <div class="filename-input-wrap">
                        <input
                            type="text"
                            id="opt-filename"
                            value="AlQuran-Kindle"
                        />
                        <span class="filename-ext">.epub</span>
                    </div>
                </div>
            </section>

            <!-- Generate button -->
            <div class="generate-wrap">
                <button class="btn-generate" id="btn-generate">
                    <span class="btn-generate-icon">&#x1F4D6;</span>
                    <span class="btn-generate-text">Generate EPUB</span>
                </button>
            </div>

            <!-- Progress -->
            <section
                class="card progress-card"
                id="section-progress"
                style="display: none"
            >
                <div class="progress-header">
                    <span class="progress-title" id="progress-title"
                        >Mempersiapkan...</span
                    >
                    <span class="progress-pct" id="progress-pct">0%</span>
                </div>
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <p class="progress-detail" id="progress-detail"></p>
            </section>
        </main>

        <footer class="site-footer">
            <p>
                Source code:
                <a
                    href="https://github.com/TwoA2U/Quran-Generator"
                    target="_blank"
                    >github.com/TwoA2U/Quran-Generator</a
                >
                &nbsp;·&nbsp; Font:
                <a href="https://software.sil.org/scheherazade/" target="_blank"
                    >Scheherazade New (SIL OFL)</a
                >
            </p>
        </footer>

        <script type="module" src="/src/main.js"></script>
    </body>
</html>
